<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תמי-נאוטיקה · Tami-Nautica | ויקי ביוגרפי ואמנותי — תמר (תמי) שפר</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/portal.css" />
  <link rel="stylesheet" href="/css/feedback.css" />
  <link rel="stylesheet" href="/css/themes.css" />
  <script>try{var t=localStorage.getItem("tami70_theme");document.documentElement.setAttribute("data-theme",t||"ocean");}catch(e){}</script>
</head>
<body>
  <header class="portal-topbar">
    <div class="portal-brand">
      <h1>תמי-נאוטיקה · ויקי ביוגרפי ואמנותי — תמר (תמי) שפר</h1>
      <span class="portal-secret-chip">Tami-Nautica @ 70 — סודי</span>
    </div>
    <nav class="portal-nav-links" aria-label="ניווט ראשי">
      <a class="portal-nav-link" href="/">תמי-נאוטיקה (3D)</a>
      <a class="portal-nav-link active" href="/wiki">ויקי ביוגרפי (31 ערכים)</a>
      <a class="portal-nav-link" href="/catalog">קטלוג והעלאת תמונות</a>
    </nav>
    <div class="portal-actions" id="portal-beta-actions"></div>
  </header>

  <main class="wiki-layout">
    <aside class="wiki-sidebar" aria-label="תוכן עניינים בוויקי">
      <input
        type="search"
        id="wiki-search-input"
        class="portal-input"
        placeholder="חיפוש ערך (הרצליה, ארלוזורוב, אראלה, פריז...)"
      />
      <div id="wiki-nav-sections"></div>
    </aside>

    <article class="wiki-article-card">
      <div class="wiki-meta-bar">
        <div class="wiki-meta-pills" id="wiki-meta-pills"></div>
        <button type="button" class="icon-btn" id="wiki-comment-page-btn">
          💬 הוסף תיקון / זיכרון לערך זה
        </button>
      </div>
      <div id="wiki-article-body" class="wiki-markdown-body">טוען ערך...</div>
    </article>
  </main>

  <script type="module" src="/js/wiki_app.js"></script>
</body>
</html>
